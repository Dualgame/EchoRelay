name: build
on: [push, pull_request]
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet test EchoRelay.Core.Test
      - run: dotnet run --project EchoRelay.Headless -- --early-quit-selftest
      - name: publish EchoRelay.Headless
        run: |
          for rid in linux-arm64 linux-x64 win-x64; do
            dotnet publish EchoRelay.Headless -c Release -r $rid --self-contained -p:PublishSingleFile=true -o out/$rid
          done
      - uses: actions/upload-artifact@v4
        with: { name: echorelay-headless, path: out/ }
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: msbuild EchoRelay.Patch\EchoRelay.Patch.vcxproj -t:restore -p:RestorePackagesConfig=true -p:PackagesDirectory=..\packages
      - run: msbuild EchoRelay.GameServer\EchoRelay.GameServer.vcxproj /p:Configuration=Release /p:Platform=x64
      - run: msbuild EchoRelay.Patch\EchoRelay.Patch.vcxproj /p:Configuration=Release /p:Platform=x64
      - run: dotnet build EchoRelay.App -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: echorelay-native
          path: |
            EchoRelay.GameServer/x64/Release/EchoRelay.GameServer.dll
            EchoRelay.Patch/x64/Release/EchoRelay.Patch.dll
